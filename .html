<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oy Modeli - To'liq ko'rinish</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();

        // Kamerani uzoqlashtirdik (camera.position.z = 3 qildik, oldin 2 edi)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Sifatni oshirish
        document.body.appendChild(renderer.domElement);

        // Oy geometriyasi
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const moonTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg');
        
        const material = new THREE.MeshStandardMaterial({ 
            map: moonTexture,
            roughness: 1
        });

        const moon = new THREE.Mesh(geometry, material);
        scene.add(moon);

        // Yorug'lik
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(10, 5, 10);
        scene.add(pointLight);

        // Boshqaruv (Sichqoncha bilan aylantirish imkoniyati)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Harakatni yumshoq qiladi

        function animate() {
            requestAnimationFrame(animate);
            
            // Avtomatik aylanish (ixtiyoriy)
            moon.rotation.y += 0.002;

            controls.update(); // Boshqaruvni yangilab turish
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
  </html>
